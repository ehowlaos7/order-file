<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' blob:; base-uri 'none'; form-action 'none'">
<title>수주 사진 정리 받기</title>
<style>
:root{color-scheme:light dark;--bg:#f7f2e9;--card:#fffdf9;--ink:#2b2420;--soft:#6f6358;--line:#e4dacb;--btn:#74441f;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#1f1a16;--card:#2a241f;--ink:#f2e9df;--soft:#b8aa9b;--line:#463b31;--btn:#7c4b22;--err:#ff9a90}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.5;padding:24px 16px}
main{max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:20px;margin:0 0 6px}
p{margin:6px 0;color:var(--soft)}
button{margin:14px 0;min-height:46px;width:100%;border:0;border-radius:10px;background:var(--btn);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.err{color:var(--err);font-weight:700}
</style>
</head>
<body>
<main>
  <h1 id="title">수주 사진 정리 받기</h1>
  <p id="msg">사진을 넣어 파일을 만들고 있어요.</p>
  <button id="again" type="button" hidden>파일 다시 받기</button>
</main>
<script>
// xlsx와 zip(저장 방식) 만들기
function crc32(b) {
  var t = crc32.t;
  if (!t) { t = crc32.t = []; for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } }
  var r = 0xFFFFFFFF;
  for (var i = 0; i < b.length; i++) r = t[(r ^ b[i]) & 255] ^ (r >>> 8);
  return (r ^ 0xFFFFFFFF) >>> 0;
}
function makeZip(files) {
  var enc = new TextEncoder(), parts = [], central = [], offset = 0;
  function u16(v) { return [v & 255, (v >> 8) & 255]; }
  function u32(v) { return [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255]; }
  files.forEach(function (f) {
    var name = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
    var head = [].concat(u16(20), u16(0x0800), u16(0), u16(0), u16(0x21), u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0));
    parts.push(new Uint8Array([0x50, 0x4B, 3, 4].concat(head)), name, data);
    central.push(new Uint8Array([0x50, 0x4B, 1, 2].concat(u16(20), head, u16(0), u16(0), u16(0), u32(0), u32(offset))), name);
    offset += 4 + head.length + name.length + data.length;
  });
  var csize = central.reduce(function (s, p) { return s + p.length; }, 0);
  var end = new Uint8Array([0x50, 0x4B, 5, 6].concat(u16(0), u16(0), u16(files.length), u16(files.length), u32(csize), u32(offset), u16(0)));
  var all = parts.concat(central, [end]), total = all.reduce(function (s, p) { return s + p.length; }, 0), out = new Uint8Array(total), at = 0;
  all.forEach(function (p) { out.set(p, at); at += p.length; });
  return out;
}
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function pkPhoto(src) {
    return new Promise(function (res) {
      var im = new Image();
      im.onload = function () {
        var S = 200, c = document.createElement('canvas'); c.width = c.height = S;
        var g = c.getContext('2d'), r = Math.min(S / im.width, S / im.height), w = im.width * r, h = im.height * r;
        g.fillStyle = '#fff'; g.fillRect(0, 0, S, S); g.drawImage(im, (S - w) / 2, (S - h) / 2, w, h);
        c.toBlob(function (b) { if (!b) return res(null); b.arrayBuffer().then(function (a) { res(new Uint8Array(a)); }, function () { res(null); }); }, 'image/jpeg', 0.85);
      };
      im.onerror = function () { res(null); };
      im.src = src;
    });
  }
  function pkXlsx(rows) {
    // rows: [{name, code, qty, note, photo(Uint8Array|null)}] 사진 있는 줄이 먼저, 그다음 사진 없는 줄
    var e = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
    var X = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
    var M = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main', R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships', P = 'http://schemas.openxmlformats.org/package/2006/relationships';
    var XDR = 'http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing', A = 'http://schemas.openxmlformats.org/drawingml/2006/main';
    var L = 'ABCDEF', out = [], pics = [], n = 1;
    var str = function (c, s, v) { return '<c r="' + c + '" s="' + s + '" t="inlineStr"><is><t xml:space="preserve">' + e(v) + '</t></is></c>'; };
    var cell = function (c, s, v) { return v === '' || v == null ? '<c r="' + c + '" s="' + s + '"/>' : typeof v === 'number' ? '<c r="' + c + '" s="' + s + '"><v>' + v + '</v></c>' : str(c, s, v); };
    out.push('<row r="1" ht="22" customHeight="1">' + ['번호', '사진', '품명', '상품코드', '수량', '확인'].map(function (h, j) { return str(L[j] + 1, 1, h); }).join('') + '</row>');
    var has = rows.filter(function (x) { return x.photo; }), no = rows.filter(function (x) { return !x.photo; }), k = 0;
    var line = function (x) {
      n++; k++;
      out.push('<row r="' + n + '" ht="' + (x.photo ? 75 : 20) + '" customHeight="1">' + cell('A' + n, 3, k) + cell('B' + n, 3, '') + cell('C' + n, 2, x.name) + str('D' + n, 4, x.code) + cell('E' + n, 5, x.qty) + str('F' + n, 3, '☐') + '</row>');
      if (x.photo) pics.push({ row: n - 1, data: x.photo });
    };
    has.forEach(line);
    if (no.length) {
      n += 2;
      out.push('<row r="' + n + '" ht="22" customHeight="1">' + str('A' + n, 6, '사진 없는 제품 (' + no.length + '줄)') + 'BCDEF'.split('').map(function (c) { return '<c r="' + c + n + '" s="7"/>'; }).join('') + '</row>');
      no.forEach(line);
    }
    var files = [], anchors = pics.map(function (p, i) {
      files.push({ name: 'xl/media/image' + (i + 1) + '.jpeg', data: p.data });
      return '<xdr:twoCellAnchor editAs="twoCell"><xdr:from><xdr:col>1</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>' + p.row + '</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:from><xdr:to><xdr:col>2</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>' + (p.row + 1) + '</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:to>' +
        '<xdr:pic><xdr:nvPicPr><xdr:cNvPr id="' + (i + 2) + '" name="사진 ' + (i + 1) + '"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr><xdr:blipFill><a:blip r:embed="rId' + (i + 1) + '"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>' +
        '<xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="952500" cy="952500"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:twoCellAnchor>';
    });
    var cols = [6, 12.5, 46, 17, 8, 7].map(function (w, j) { return '<col min="' + (j + 1) + '" max="' + (j + 1) + '" width="' + w + '" customWidth="1"/>'; }).join('');
    var sheet = X + '<worksheet xmlns="' + M + '" xmlns:r="' + R + '"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><dimension ref="A1:F' + n + '"/>' +
      '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="16.5"/><cols>' + cols + '</cols>' +
      '<sheetData>' + out.join('') + '</sheetData><pageMargins left="0.3" right="0.3" top="0.5" bottom="0.5" header="0.3" footer="0.3"/><pageSetup paperSize="9" orientation="portrait" fitToWidth="1" fitToHeight="0"/>' + (pics.length ? '<drawing r:id="rId1"/>' : '') + '</worksheet>';
    var bd = '<border><left style="thin"><color rgb="FFBFBFBF"/></left><right style="thin"><color rgb="FFBFBFBF"/></right><top style="thin"><color rgb="FFBFBFBF"/></top><bottom style="thin"><color rgb="FFBFBFBF"/></bottom><diagonal/></border>';
    var styles = X + '<styleSheet xmlns="' + M + '"><fonts count="3"><font><sz val="11"/><name val="맑은 고딕"/><family val="3"/></font><font><b/><sz val="11"/><name val="맑은 고딕"/><family val="3"/></font><font><b/><sz val="13"/><name val="맑은 고딕"/><family val="3"/></font></fonts>' +
      '<fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFDDEBF7"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFFCE4D6"/><bgColor indexed="64"/></patternFill></fill></fills>' +
      '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>' + bd + '</borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="8">' +
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
      '<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>' +
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +
      '<xf numFmtId="49" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf>' +
      '<xf numFmtId="0" fontId="2" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +
      '<xf numFmtId="0" fontId="1" fillId="3" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center"/></xf>' +
      '<xf numFmtId="0" fontId="0" fillId="3" borderId="0" xfId="0" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
    files.unshift(
      { name: '[Content_Types].xml', data: X + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' + (pics.length ? '<Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>' : '') + '</Types>' },
      { name: '_rels/.rels', data: X + '<Relationships xmlns="' + P + '"><Relationship Id="rId1" Type="' + R + '/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
      { name: 'xl/workbook.xml', data: X + '<workbook xmlns="' + M + '" xmlns:r="' + R + '"><sheets><sheet name="수주 정리" sheetId="1" r:id="rId1"/></sheets><definedNames><definedName name="_xlnm.Print_Titles" localSheetId="0">\'수주 정리\'!$1:$1</definedName></definedNames></workbook>' },
      { name: 'xl/_rels/workbook.xml.rels', data: X + '<Relationships xmlns="' + P + '"><Relationship Id="rId1" Type="' + R + '/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="' + R + '/styles" Target="styles.xml"/></Relationships>' },
      { name: 'xl/styles.xml', data: styles },
      { name: 'xl/worksheets/sheet1.xml', data: sheet }
    );
    if (pics.length) {
      files.push({ name: 'xl/worksheets/_rels/sheet1.xml.rels', data: X + '<Relationships xmlns="' + P + '"><Relationship Id="rId1" Type="' + R + '/drawing" Target="../drawings/drawing1.xml"/></Relationships>' });
      files.push({ name: 'xl/drawings/drawing1.xml', data: X + '<xdr:wsDr xmlns:xdr="' + XDR + '" xmlns:a="' + A + '" xmlns:r="' + R + '">' + anchors.join('') + '</xdr:wsDr>' });
      files.push({ name: 'xl/drawings/_rels/drawing1.xml.rels', data: X + '<Relationships xmlns="' + P + '">' + pics.map(function (p, i) { return '<Relationship Id="rId' + (i + 1) + '" Type="' + R + '/image" Target="../media/image' + (i + 1) + '.jpeg"/>'; }).join('') + '</Relationships>' });
    }
    return makeZip(files);
  }
  function fail(t) { $('title').textContent = '파일을 만들 수 없어요'; $('msg').textContent = t; $('msg').className = 'err'; }
  var raw = location.hash.slice(1), k = raw.slice(0, 2), data = raw.slice(2);
  // 내용이 방문 기록에 오래 남지 않도록 주소에서 지웁니다.
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  if ((k !== 'z=' && k !== 'j=') || !data) return fail('발주 페이지의 [수주 사진 정리]에서 다시 눌러 주세요.');
  var bin;
  try { var s = atob(data.replace(/-/g, '+').replace(/_/g, '/')); bin = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) bin[i] = s.charCodeAt(i); } catch (e) { return fail('주소가 잘렸어요. 발주 페이지에서 다시 눌러 주세요.'); }
  var read = k === 'z=' ? new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text() : Promise.resolve(new TextDecoder().decode(bin));
  var file = null, name = '';
  read.then(function (t) {
    var d = JSON.parse(t), list = d.r.map(function (r) { return { name: r[0], code: r[1], qty: r[2], note: r[3], img: r[4] ? 'img/' + r[1] + '.jpg' : null }; });
    return Promise.all(list.map(function (x) { return x.img ? pkPhoto(x.img) : Promise.resolve(null); })).then(function (ph) {
      var rows = list.map(function (x, i) { return { name: x.name, code: x.code, qty: x.qty, note: x.note, photo: ph[i] }; });
      var withPic = rows.filter(function (x) { return x.photo; }).concat(rows.filter(function (x) { return !x.photo; }));
      var dt = new Date(), p2 = function (v) { return ('0' + v).slice(-2); };
      name = '사진정리_' + String(d.f || '수주').replace(/[\\/:*?"<>|]/g, '_') + '_' + p2(dt.getMonth() + 1) + p2(dt.getDate()) + '_' + p2(dt.getHours()) + p2(dt.getMinutes()) + '.xlsx';
      file = new Blob([pkXlsx(withPic)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      var n = rows.filter(function (x) { return x.photo; }).length;
      $('msg').textContent = '사진 있음 ' + n + '줄, 사진 없음 ' + (rows.length - n) + '줄로 정리했어요. 파일 받기가 시작돼요. 안 받아지면 아래 버튼을 눌러 주세요.';
      $('again').hidden = false; give();
    });
  }).catch(function () { fail('파일을 만들지 못했어요. 발주 페이지에서 다시 눌러 주세요.'); });
  function give() { var a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
  $('again').addEventListener('click', give);
})();
</script>
</body>
</html>
